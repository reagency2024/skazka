# Сборка Android-приложения «7 весомых сунн» (APK для установки на телефон).
# Этот файл работает, когда папка проекта — корень собственного репозитория GitHub.
# Готовый файл — Actions → запуск → Artifacts → sunnah-android.
# Адрес сервера по умолчанию: переменная репозитория SUNNAH_SERVER.
name: android

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Тесты
        run: npm test
      - name: Android-проект
        env:
          SUNNAH_SERVER: ${{ vars.SUNNAH_SERVER }}
        run: npm run android
      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sunnah-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

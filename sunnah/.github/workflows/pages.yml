# Публикация веб-версии «7 весомых сунн» на GitHub Pages (ветка gh-pages).
# Этот файл работает, когда папка проекта — корень собственного репозитория GitHub.
name: pages

on:
  push:
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Обновить ветку gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          cd pages
          git rm -rq --ignore-unmatch .
          cp -r ../public/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Обновление веб-версии: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages

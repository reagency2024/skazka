<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Сказка про меня</title>
  <meta name="theme-color" content="#141b3c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main id="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>

</html>
